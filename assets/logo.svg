<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 160" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2B32" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>

    <linearGradient id="silverWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#EDEDED" />
      <stop offset="100%" stop-color="#D0D0D5" />
    </linearGradient>

    <linearGradient id="sunRayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1E27" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF2B32" stop-opacity="1" />
      <stop offset="100%" stop-color="#FF1E27" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neonBoxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left: Main Royal Eye Logo -->
  <g transform="translate(10, 15)">
    <!-- "R" -->
    <text x="5" y="75" font-family="'Outfit', 'Montserrat', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="78" fill="url(#silverWhite)" letter-spacing="-1">R</text>

    <!-- Stylized "o" (Solar Globe Eye) -->
    <g transform="translate(68, 14)">
      <!-- Red circular solar crown/rim behind -->
      <circle cx="28" cy="38" r="27" fill="#140203" stroke="url(#redGlow)" stroke-width="2.5" />
      <!-- Solar Ray spokes around eye -->
      <path d="M 28 8 L 28 3 M 49 17 L 53 13 M 58 38 L 63 38 M 49 59 L 53 63 M 28 68 L 28 73 M 7 59 L 3 63 M 0 38 L -3 38 M 7 17 L 3 13" 
            stroke="#FF2B32" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

      <!-- Red curved top hemisphere / solar arc -->
      <path d="M 9 38 A 19 19 0 0 1 47 38 Z" fill="url(#redGlow)" />

      <!-- White latitude globe grid inside eye -->
      <g stroke="#FFFFFF" stroke-width="1.6" fill="none" opacity="0.95">
        <ellipse cx="28" cy="38" rx="19" ry="19" />
        <ellipse cx="28" cy="38" rx="13" ry="19" />
        <ellipse cx="28" cy="38" rx="6.5" ry="19" />
        <line x1="9" y1="38" x2="47" y2="38" />
        <line x1="12" y1="28" x2="44" y2="28" />
        <line x1="12" y1="48" x2="44" y2="48" />
      </g>
      <!-- Center solar pupil core -->
      <circle cx="28" cy="38" r="4.5" fill="#FF1E27" />
      <circle cx="28" cy="38" r="2" fill="#FFFFFF" />
    </g>

    <!-- "yal" -->
    <text x="132" y="75" font-family="'Outfit', 'Montserrat', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="78" fill="url(#silverWhite)" letter-spacing="-1">yal</text>

    <!-- "Eye" in vibrant red -->
    <text x="275" y="75" font-family="'Outfit', 'Montserrat', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="78" fill="url(#redGlow)" letter-spacing="-1">Eye</text>

    <!-- Red underline beam -->
    <rect x="5" y="86" width="410" height="4.5" rx="2" fill="url(#redGlow)" filter="url(#glow)" />

    <!-- Subtitle: SOLAR POWER -->
    <text x="8" y="108" font-family="'Rajdhani', 'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="21" fill="#FFFFFF" letter-spacing="11">SOLAR POWER</text>
    
    <!-- Tagline: POWERING YOUR FUTURE WITH THE SUN -->
    <text x="8" y="125" font-family="'Outfit', 'Inter', sans-serif" font-weight="600" font-size="9.5" fill="#FF4D52" letter-spacing="2.8">POWERING YOUR FUTURE WITH THE SUN</text>
  </g>

  <!-- Right: REX - Royal Eye Excellence Badge (Exact from Poster) -->
  <g transform="translate(470, 18)">
    <!-- Dark carbon box with red neon border -->
    <rect x="0" y="0" width="260" height="118" rx="14" fill="#0E0E12" stroke="url(#redGlow)" stroke-width="2.5" filter="url(#neonBoxGlow)" />
    <!-- Inner subtle border -->
    <rect x="4" y="4" width="252" height="110" rx="10" fill="none" stroke="#FF1E27" stroke-width="0.8" opacity="0.4" />
    
    <!-- Stylized REX letters -->
    <g transform="translate(18, 16)">
      <!-- Stylized 'R' with energy stripes -->
      <path d="M 10 10 L 38 10 C 48 10 54 16 54 26 C 54 35 48 40 38 41 L 54 58 L 40 58 L 26 41 L 22 41 L 22 58 L 10 58 Z M 22 20 L 22 32 L 35 32 C 40 32 43 29 43 26 C 43 22 40 20 35 20 Z" 
            fill="url(#redGlow)" />
      <!-- 'E' with futuristic angled cuts -->
      <path d="M 64 10 L 106 10 L 106 20 L 76 20 L 76 29 L 100 29 L 100 39 L 76 39 L 76 48 L 106 48 L 106 58 L 64 58 Z" 
            fill="url(#redGlow)" />
      <!-- 'X' connected -->
      <path d="M 116 10 L 131 10 L 145 31 L 159 10 L 174 10 L 153 34 L 176 58 L 161 58 L 145 38 L 129 58 L 114 58 L 137 34 Z" 
            fill="url(#redGlow)" />
    </g>

    <!-- Subtitle below REX: Royal Eye Excellence -->
    <g transform="translate(18, 92)">
      <text x="0" y="0" font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="800" font-size="14.5" fill="#FFFFFF">Royal</text>
      <!-- Mini red globe inside subtitle -->
      <circle cx="43" cy="-4.5" r="4" fill="url(#redGlow)" />
      <text x="50" y="0" font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="800" font-size="14.5" fill="#FFFFFF">Eye</text>
      <text x="82" y="0" font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#FF333A" letter-spacing="3">EXCELLENCE</text>
    </g>
  </g>
</svg>
