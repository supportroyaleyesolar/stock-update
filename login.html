<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royal Eye Solar Power | Staff Login</title>
  <meta name="description" content="Royal Eye Solar Power Stock Register - Staff & Manager Authentication" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 15px; }
    body {
      font-family: 'Inter', sans-serif;
      background: #09090c;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 450px;
      background: radial-gradient(circle, rgba(201, 162, 39, 0.12) 0%, rgba(255, 30, 39, 0.06) 50%, transparent 75%);
      pointer-events: none;
      z-index: 0;
    }

    :root {
      --red: #ff1e27;
      --red-hover: #ff3a42;
      --red-soft: rgba(255, 30, 39, 0.12);
      --gold: #c9a227;
      --gold-soft: rgba(201, 162, 39, 0.14);
      --surface: #121217;
      --elevated: #1a1a22;
      --card: #16161e;
      --border: rgba(255, 255, 255, 0.08);
      --border2: rgba(255, 255, 255, 0.14);
      --txt1: #ffffff;
      --txt2: #b0b0c2;
      --txt3: #6f6f82;
      --green: #00e676;
      --amber: #ffab00;
      --radius: 12px;
      --tr: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255,30,39,0.2) 0%, rgba(201,162,39,0.25) 100%);
      border: 1px solid var(--border2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .brand-icon svg {
      color: var(--gold);
    }
    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--txt1);
    }
    .brand-title span {
      color: var(--gold);
    }
    .brand-tagline {
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--txt3);
      margin-top: 4px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: 16px;
      padding: 30px 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--red), var(--gold));
    }

    .form-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--txt1);
      margin-bottom: 6px;
    }
    .form-subtitle {
      font-size: 0.8rem;
      color: var(--txt2);
      margin-bottom: 20px;
    }

    /* Existing session banner */
    .session-banner {
      display: none;
      background: var(--gold-soft);
      border: 1px solid rgba(201, 162, 39, 0.35);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
      font-size: 0.82rem;
      color: var(--txt1);
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .session-banner.active { display: flex; }
    .btn-quick-in {
      background: var(--gold);
      color: #000;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Quick User Picker */
    .user-picker-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--txt3);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
      gap: 7px;
      margin-bottom: 20px;
    }
    .user-chip {
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--txt2);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: var(--tr);
      text-align: center;
    }
    .user-chip:hover {
      border-color: var(--gold);
      color: var(--txt1);
      background: rgba(201, 162, 39, 0.08);
    }
    .user-chip.selected {
      background: var(--gold-soft);
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 0 10px rgba(201, 162, 39, 0.2);
    }
    .user-avatar-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--txt1);
    }
    .user-chip.selected .user-avatar-badge {
      background: var(--gold);
      color: #000;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--txt3);
      margin-bottom: 6px;
    }
    .input-wrap {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--txt3);
      pointer-events: none;
      display: flex;
      align-items: center;
    }
    .form-input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      background: var(--elevated);
      border: 1px solid var(--border2);
      border-radius: 9px;
      color: var(--txt1);
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      outline: none;
      transition: var(--tr);
    }
    .form-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.15);
    }
    .form-input::placeholder {
      color: var(--txt3);
    }

    .toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--txt3);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
      transition: color 0.15s;
    }
    .toggle-pass:hover { color: var(--txt1); }

    .error-box {
      display: none;
      background: rgba(255, 51, 75, 0.12);
      border: 1px solid rgba(255, 51, 75, 0.35);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: #ff6b7e;
      align-items: center;
      gap: 8px;
    }
    .error-box.show { display: flex; }

    .btn-submit {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      background: linear-gradient(135deg, #ff1e27 0%, #d81620 100%);
      border: 1px solid rgba(255, 30, 39, 0.5);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: var(--tr);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(255, 30, 39, 0.35);
      margin-top: 6px;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #ff3a42 0%, #f0222d 100%);
      box-shadow: 0 6px 24px rgba(255, 30, 39, 0.5);
      transform: translateY(-1px);
    }
    .btn-submit:active {
      transform: translateY(0);
    }

    .footer-note {
      text-align: center;
      margin-top: 22px;
      font-size: 0.72rem;
      color: var(--txt3);
      letter-spacing: 0.5px;
    }
    .footer-note span { color: var(--gold); }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path>
          <path d="M12 20v2"></path>
          <path d="m4.93 4.93 1.41 1.41"></path>
          <path d="m17.66 17.66 1.41 1.41"></path>
          <path d="M2 12h2"></path>
          <path d="M20 12h2"></path>
          <path d="m6.34 17.66-1.41 1.41"></path>
          <path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
      </div>
      <h1 class="brand-title">ROYAL <span>EYE</span></h1>
      <p class="brand-tagline">SOLAR POWER &bull; STOCK REGISTER</p>
    </div>

    <div class="card">
      <div id="session-banner" class="session-banner">
        <div>Logged in as <strong id="logged-user-name" style="color:var(--gold);"></strong></div>
        <button id="btn-quick-in" class="btn-quick-in" type="button">Open Register &rarr;</button>
      </div>

      <h2 class="form-title">Staff Sign In</h2>
      <p class="form-subtitle">Select or type your staff account to access live stock.</p>

      <div class="user-picker-label">
        <span>Quick Select Staff</span>
        <span style="font-size:0.68rem; color:var(--gold);">Password: eye321</span>
      </div>
      <div class="user-picker-grid" id="user-chips">
        <!-- Injected via JavaScript -->
      </div>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
            <input class="form-input" id="username" name="username" type="text" placeholder="e.g. manager, krishnanunni" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
            <input class="form-input" id="password" name="password" type="password" placeholder="Enter password (eye321)" required />
            <button class="toggle-pass" type="button" id="btn-toggle-pass" title="Show password">
              <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div id="error-box" class="error-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <span id="error-msg">Invalid credentials</span>
        </div>

        <button class="btn-submit" type="submit" id="btn-submit">
          <span>Sign In to Stock Register</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>
    </div>

    <div class="footer-note">
      Royal Eye Solar Power System &bull; <span>Live Realtime Sync</span>
    </div>
  </div>

  <script>
    // ── Staff Accounts Definition ──────────────────────────────────────
    const VALID_USERS = [
      { username: 'krishnanunni', displayName: 'Krishnanunni', role: 'Administrator', initial: 'K' },
      { username: 'manager',      displayName: 'Manager',      role: 'Store Admin',   initial: 'M' },
      { username: 'neethu',       displayName: 'Neethu',       role: 'Staff',         initial: 'N' },
      { username: 'sharanya',     displayName: 'Sharanya',     role: 'Staff',         initial: 'S' },
      { username: 'ashwathy',     displayName: 'Ashwathy',     role: 'Staff',         initial: 'A' },
      { username: 'seena',        displayName: 'Seena',        role: 'Staff',         initial: 'S' },
      { username: 'pranav',       displayName: 'Pranav',       role: 'Staff',         initial: 'P' }
    ];

    const MASTER_PASSWORD = 'eye321';
    const USER_STORE_KEY  = 'royaleye_user';

    const chipsContainer = document.getElementById('user-chips');
    const usernameInput  = document.getElementById('username');
    const passwordInput  = document.getElementById('password');
    const loginForm      = document.getElementById('login-form');
    const errorBox       = document.getElementById('error-box');
    const errorMsg       = document.getElementById('error-msg');
    const togglePassBtn  = document.getElementById('btn-toggle-pass');
    const sessionBanner  = document.getElementById('session-banner');
    const loggedUserName = document.getElementById('logged-user-name');
    const quickInBtn     = document.getElementById('btn-quick-in');

    // ── Render Quick Select Chips ──────────────────────────────────────
    function renderUserChips() {
      chipsContainer.innerHTML = VALID_USERS.map(u => `
        <button type="button" class="user-chip" data-user="${u.username}">
          <span class="user-avatar-badge">${u.initial}</span>
          <span>${u.displayName}</span>
          ${u.role === 'Administrator' ? '<span style="font-size:0.62rem;background:rgba(255,30,39,0.18);border:1px solid rgba(255,30,39,0.4);color:#ff334b;padding:1px 6px;border-radius:99px;font-weight:700;margin-left:4px;">Admin</span>' : ''}
        </button>
      `).join('');

      chipsContainer.querySelectorAll('.user-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const u = chip.dataset.user;
          usernameInput.value = u;
          chipsContainer.querySelectorAll('.user-chip').forEach(c => c.classList.remove('selected'));
          chip.classList.add('selected');
          hideError();
          passwordInput.focus();
        });
      });
    }

    usernameInput.addEventListener('input', () => {
      const val = usernameInput.value.trim().toLowerCase();
      chipsContainer.querySelectorAll('.user-chip').forEach(c => {
        c.classList.toggle('selected', c.dataset.user.toLowerCase() === val);
      });
    });

    // ── Check Existing Session ─────────────────────────────────────────
    function checkCurrentSession() {
      try {
        const raw = localStorage.getItem(USER_STORE_KEY);
        if (raw) {
          const user = JSON.parse(raw);
          if (user && user.displayName) {
            loggedUserName.textContent = user.displayName;
            sessionBanner.classList.add('active');
            quickInBtn.addEventListener('click', () => {
              window.location.href = 'index.html';
            });
          }
        }
      } catch (e) {}
    }

    // ── Toggle Password Visibility ─────────────────────────────────────
    let passVisible = false;
    togglePassBtn.addEventListener('click', () => {
      passVisible = !passVisible;
      passwordInput.type = passVisible ? 'text' : 'password';
      togglePassBtn.innerHTML = passVisible
        ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
        : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorBox.classList.add('show');
    }

    function hideError() {
      errorBox.classList.remove('show');
    }

    // ── Form Submission ────────────────────────────────────────────────
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      hideError();

      const userEntered = usernameInput.value.trim().toLowerCase();
      const passEntered = passwordInput.value.trim();

      const account = VALID_USERS.find(u => u.username.toLowerCase() === userEntered);

      if (!account) {
        showError('Invalid username. Please select or enter a valid staff name.');
        usernameInput.focus();
        return;
      }

      if (passEntered !== MASTER_PASSWORD) {
        showError('Incorrect password! Password is eye321.');
        passwordInput.focus();
        return;
      }

      // Successful login
      const sessionData = {
        username: account.username,
        displayName: account.displayName,
        role: account.role,
        loginTime: new Date().toISOString()
      };

      try {
        localStorage.setItem(USER_STORE_KEY, JSON.stringify(sessionData));
      } catch (err) {
        console.error('Error saving session:', err);
      }

      const submitBtn = document.getElementById('btn-submit');
      submitBtn.innerHTML = '<span>Logging in...</span>';
      submitBtn.style.opacity = '0.8';
      submitBtn.disabled = true;

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 350);
    });

    renderUserChips();
    checkCurrentSession();
  </script>
</body>
</html>
